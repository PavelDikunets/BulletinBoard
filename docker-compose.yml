services:

  bulletin-board.hosts.api:
    image: bulletin-board.hosts.api
    build:
      context: .
      dockerfile: src/BulletinBoard/Hosts/BulletinBoard.Hosts.Api/Dockerfile
    ports:
      - "5001:8080"
    networks:
      - bulletin-board-network
  
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres
    networks:
      - bulletin-board-network

volumes:
  postgres_data:

networks:
  bulletin-board-network: